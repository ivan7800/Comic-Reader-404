<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Restablecer Comic Reader 404</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f7f8;background:#090a0d}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#14161c;border:1px solid #30333d;border-radius:20px;padding:24px;box-sizing:border-box;box-shadow:0 20px 60px #0008}h1{margin-top:0;font-size:clamp(1.5rem,5vw,2.2rem)}p{line-height:1.55;color:#c9cbd2}button,a{font:inherit}button{min-height:48px;border:0;border-radius:12px;padding:0 18px;background:#ff5a36;color:#111;font-weight:800;cursor:pointer}a{color:#ff8b70}#status{margin-top:16px;color:#fff;font-weight:700}</style>
</head>
<body>
<main class="card">
<h1>Restablecer Comic Reader 404</h1>
<p>Usa esta herramienta si la interfaz se ve pero los botones no responden después de una actualización. Solo elimina el service worker y las cachés <strong>comic-reader-404-*</strong>. No borra tu biblioteca de <code>localStorage</code>.</p>
<button id="reset" type="button">Restablecer PWA</button>
<p id="status" role="status" aria-live="polite"></p>
<p><a href="./">Volver a Comic Reader 404</a></p>
</main>
<script>
const button=document.getElementById('reset');const status=document.getElementById('status');
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Restableciendo…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs){if(reg.scope.includes(location.pathname.replace(/reset\.html.*$/,'')))await reg.unregister();}}if('caches'in window){for(const key of await caches.keys()){if(key.startsWith('comic-reader-404-'))await caches.delete(key);}}status.textContent='Listo. Vuelve a la aplicación y recarga una vez.';}catch(error){status.textContent='No se pudo completar: '+(error?.message||error);}finally{button.disabled=false;}});
</script>
</body>
</html>
